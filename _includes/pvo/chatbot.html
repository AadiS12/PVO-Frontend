<button class="pvo-chat-launch glowOnHover" type="button" aria-controls="pvo-chat" aria-expanded="false" aria-label="Questions? Ask the PVO assistant" title="Questions? Ask the PVO assistant" data-chat-launch>
  {% include pvo/icon.html name="chat" %}
  <span aria-hidden="true">Questions?</span>
</button>

<section class="pvo-chat" id="pvo-chat" aria-label="PVO assistant" hidden data-chat>
  <div class="pvo-chat__head">
    <div>
      <span class="pvo-chat__title">PVO Assistant</span>
      <span class="pvo-chat__sub">Answers about services, events, and how to reach us</span>
    </div>
    <button class="small primary pvo-chat__close" type="button" aria-label="Close assistant" data-chat-close>
      {% include pvo/icon.html name="close" %}
    </button>
  </div>
  <div class="pvo-chat__notice">
    Need help with a repair? <a href="{{ '/prescreener' | relative_url }}">Start a request</a> or call <a href="{{ site.pvo_contact.phone_link }}">{{ site.pvo_contact.phone }}</a>.
  </div>
  <div class="pvo-chat__log" aria-live="polite" data-chat-log></div>
  <form class="pvo-chat__form" data-chat-form>
    <label class="pvo-visually-hidden" for="pvo-chat-input">Your question</label>
    <input id="pvo-chat-input" class="smallInput pvo-chat__input" type="text" placeholder="Ask about PVO…" autocomplete="off" maxlength="500" data-chat-input>
    <button class="medium filledHighlight primary pvo-chat__send" type="submit" aria-label="Send" data-chat-send>
      {% include pvo/icon.html name="send" %}
    </button>
  </form>
</section>
